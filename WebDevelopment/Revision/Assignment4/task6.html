<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <table cellspacing="10">
        <tr>
          <td rowspan="11" colspan="2"><img src="img.jpg" alt="doctor image" height="600" width="600"></td>
          <th colspan="3">Doctor Appointment Form</th>
        </tr>

        <tr>
          <td colspan="3"><hr color="red" /></td>
        </tr>

        <tr>
          <td><label for="date">Appointent Date</label></td>
          <td><input type="date" name="date" id="date" /></td>
          <td></td>
        </tr>

        <tr>
          <td><label for="time">Appointment Time</label></td>
          <td><input type="time" name="time" id="time" /></td>
          <td></td>
        </tr>

        <tr>
          <td><label for="1">Name</label></td>
          <td><input type="text" name="1" id="1" placeholder="First" /></td>
          <td><input type="text" name="1" id="1" placeholder="Last" /></td>
        </tr>

        <tr>
          <td><label for="gen">Gender</label></td>
          <td>
            <input type="radio" name="gen" id="gen" value="male" />
            <span>Male</span>
            <input type="radio" name="gen" id="gen" value="female" />
            <span>female</span>
          </td>
        </tr>

        <tr>
          <td><label for="ph">Phone</label></td>
          <td><input type="text" name="ph" id="ph" placeholder="####" /></td>
          <td></td>
        </tr>

        <tr>
          <td><label for="add">Address</label></td>
          <td><input type="text" name="add" id="add" placeholder="city" /></td>
          <td><input type="text" name="add" id="add" placeholder="state" /></td>
        </tr>

        <tr>
          <td><label for="query">Your Query</label></td>
          <td colspan="2"><textarea name="query" id="query"></textarea></td>
        </tr>

        <tr>
          <td><label for="type">Appointment Type</label></td>
          <td colspan="2">
            Select which appointment type(s) you require
            <br>
            <input type="checkbox" name="type" id="type" value="cer" />
            <span>Cervix checkup</span>
            <br>
            <input type="checkbox" name="type" id="type" value="heart" />
            <span>Heart checkup</span>
            <br>
            <input type="checkbox" name="type" id="type" value="eye" />
            <span>Eye checkup</span>
            <br>
            <input type="checkbox" name="type" id="type" value="hearing" />
            <span>Hearing checkup</span>
          </td>
        </tr>

        <tr>
          <td></td>
          <td>
            <button type="submit">Send</button>
          </td>
          <td></td>
        </tr>
      </table>
    </form>

    <hr>

    <button><a href="./assignment4.html">Back</a></button>
    <button><a href="../index.html">Home</a></button>

  </body>
</html>
