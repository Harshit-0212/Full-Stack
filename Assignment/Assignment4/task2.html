<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <fieldset>
        <form>
            <h2>Pizza Order Form</h2>

            <label for="fname">First Name :</label>
            <input type="text" name="fname" id="fname">

            <br>
            <br>

            <label for="lname">Last Name :</label>
            <input type="text" name="lname" id="lname">

            <br>
            <br>

            <label for="email">Email Address :</label>
            <input type="email" name="email" id="email">

            <br>
            <br>

            <label for="cn">Contact Number :</label>
            <input type="text" name="cn" id="cn">

            <br>
            <br>

            <label for="deldate">Preferred Delivery Date :</label>
            <input type="date" name="deldate" id="deldate">

            <br>
            <br>

            <label for="size">Size : </label>

            <br>

            <input type="radio" name="size" value="small" id="small">
            <span>Small</span>
             <input type="radio" name="size" value="Medium" id="Medium">
            <span>Medium</span>
             <input type="radio" name="Large" value="small" id="Large">
            <span>Large</span>

            <br>
            <br>

            <label for="flavor">Flavor :</label>
            
            <br>


            <input type="checkbox" name="flavor" id="haw" value="haw">
            <span>Hawaiian (Php 150.00)</span>

            <select name="quant">
                <option value="1" d="quant">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <br>

            <input type="checkbox" name="flavor" id="pep" value="pep">
            <span>pepperoni (Php 140.00)</span>

            <select name="quant">
                <option value="1" d="quant">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <br>

            <input type="checkbox" name="flavor" id="veg" value="veg">
            <span>Vegetable (Php 130.00)</span>

            <select name="quant">
                <option value="1" d="quant">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>

            <br>
            <br>

            <label for="creditno">Credit Card Number : </label>
            <input type="text" name="creditno" id="creditno">

            <br>
            <br>

            <label for="pin">PIN : </label>
            <input type="password" name="pin" id="name">

            <br>
            <br>

            <label for="Addnote">Additional Note : </label>
            <textarea name="Addnote" id="Addnote"></textarea>

            <br>
            <br>
            
            <button type="submit">Submit Order</button>
        
        </form>
    </fieldset>
    
</body>
</html>
