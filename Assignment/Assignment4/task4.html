<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<form>

        <table border="1" cellpadding="5">
        <tr >
            <th rowspan="2" colspan="4" >Registration Form</td>
        </tr>

        <tr>
        </tr>

        <tr>
            <td><label for="name">Student Name</label></td>
            <td><input type="text" name="name" id="name" placeholder="First Name"></td>
            <td><input type="text" name="name" id="name" placeholder="Middle Name"></td>
            <td><input type="text" name="name" id="name" placeholder="Last Name"></td>
        </tr>

        <tr>
            <td><label for="fname">Father's Name</label><</td>
            <td><input type="text" name="fname" id="fname" placeholder="Enter your father's name"></td>
            <td><label for="mname">Mother's Name</label></td>
            <td><input type="text" name="mname" id="mname" placeholder="Enter your mother's name"></td>
        </tr>

        <tr>
            <td><label for="dob">Date of Birth</label></td>
            <td><input type="date" name="dob" id="dob"></td>
            <td><label for="gender">Gender:</label></td>
            <td>
                <input type="radio" name="gender" id="gender" value="male">
                <span>Male</span>
                <input type="radio" name="gender" id="gender" value="female">
                <span>Female</span>
            </td>

        </tr>

        <tr>
            <td><label for="cate">Category</label></td>
            <td>

                <input type="radio" name="cate" id="cate" value="gen">
                <span>Gen</span>
                <input type="radio" name="cate" id="cate" value="obc">
                <span>OBC</span>
                <input type="radio" name="cate" id="cate" value="scst">
                <span>SC/ST</span>

            </td>

            <td><label for="handicapped">Handicapped</label></td>
            <td>

                <input type="radio" name="handicapped" id="handicapped" value="yes">
                <span>Yes</span>
                <input type="radio" name="handicapped" id="handicapped" vale="no">
                <span>No</span>

            </td>

        </tr>

        <tr>
            <td><label for="service">Ex-Serviceman</label></td>
            <td>

                <input type="radio" name="service"  id="service" value="yes" >
                <span>Yes</span>
                <input type="radio" name="service"  id="service" value="no" >
                <span>No</span>

            </td>

            <td><label for="ews">EWS</label></td>
            <td>
                <input type="radio" name="ews" id="ews" value="yes">
                <span>Yes</span>
                <input type="radio" name="ews" id="ews" vale="no">
                <span>No</span>
            </td>

        </tr>

        <tr>
            <td><label for="email">Email</label></td>
            <td><input type="email" name="email" id="email"></td>
            <td><label for="number">Mobile No.</label></td>
            <td><input type="text" name="number" id="number"></td>
        </tr>

        <tr>
            <td><label for="state">State</label></td>
            <td>

                <select name="state" id="state">
                    <option value="">Select any one</option>
                    <option value="mp">Madhya Pradesh</option>
                    <option value="cg">Chattisgarh</option>
                    <option value="od">Odisha</option>
                    <option value="raj">Rajasthan</option>
                    <option value="guj">Gujarat</option>
                    <option value="mah">Maharashtra</option>
                </select>

            </td>

            <td><label for="city">City</label></td>
            <td>

                <select name="city" id="city">
                    <option value="">Select any one</option>
                    <option value="bh">Bhopal</option>
                    <option value="in">Indore</option>
                    <option value="sm">Bhubaneshwar</option>
                    <option value="jai">Jaipur</option>
                    <option value="vad">Vadodra</option>
                    <option value="mum">Mumbai</option>
                </select>

            </td>

        </tr>

        <tr>
            <td><label for="photo">Upload Photo</label></td>
            <td><input type="file" name="photo" id="photo"></td>
            <td><label for="sign">Upload Signature</label></td>
            <td><input type="file" name="sign" id="sign"></td>
        </tr>

        <tr>
            <td></td>
            <td colspan="3">
                <button type="submit">Submit</button>
            </td>
        </tr>
    </table>
    
</form>
    
</body>
</html>
